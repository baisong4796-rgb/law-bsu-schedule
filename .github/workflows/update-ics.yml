name: Update Group 3 class schedule
on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python update_group3.py
      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add group3_schedule.ics group3_events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Group 3 schedule $(date -u +%Y-%m-%d)"
            git push
          fi
